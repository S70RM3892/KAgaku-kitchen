<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ケミカル・キッチン</title>
<meta name="description" content="反応式を組む「反応式モード」、元素から分子式を組む「組成モード」、部品で有機化合物を組み検出反応で見分ける「官能基モード」、イオンで酸・塩基・塩・錯イオンを組み半反応式を完成させる「無機イオンモード」で遊べる化学クッキングゲーム。友達と協力・対戦もできる。">
<meta name="theme-color" content="#16323d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="title" class="screen on" aria-label="タイトル">
    <h1 class="logo">ケミカル・キッチン<small>注文の物質を作って届けろ。化学4モード＋英語3モードから選べる。<span class="land">📱 <b>横持ち・縦持ち</b>どちらでも遊べる（⚙設定で固定もできる）</span></small></h1>
    <div class="seg subj" id="titleSubj" role="group" aria-label="科目"><button data-subj="chem">🧪 化学</button><button data-subj="eng">🔤 英語</button></div>
    <div class="seg gsel" id="titleGame" role="group" aria-label="ゲームモード">
      <button data-g="rx">反応式モード<small>試薬・触媒・加熱で反応を組む</small></button>
      <button data-g="atom">組成モード<small>周期表の元素で分子式を組む</small></button>
      <button data-g="org">官能基モード<small>部品で有機化合物・検出反応</small></button>
      <button data-g="ion">無機イオンモード<small>イオンで酸・塩基・塩・錯イオン・半反応式</small></button>
      <button data-g="quiz">早押しクイズ<small>ヒントから物質をみんなで早押し</small></button>
      <button data-g="eroot">語根モード<small>接頭辞・語根・接尾辞で単語を組む</small></button>
      <button data-g="esyn">構文モード<small>構文の語句を正しい順に並べる</small></button>
      <button data-g="eword">見分けモード<small>紛らわしい2語から空所の語を選ぶ</small></button>
    </div>

    <div class="mp-card">
      <div class="mp-h">友達と遊ぶ<span>2〜4人・それぞれのスマホ/PCで</span></div>
      <label class="namebox">名前<input id="inName" maxlength="10" autocomplete="nickname" placeholder="ケミスト"></label>
      <div class="row-btns">
        <button class="btn go" id="btnHost">部屋を作る</button>
        <button class="btn" id="btnJoin">部屋に入る</button>
      </div>
      <div class="mp-modes">
        <div><b>協力</b>棚を分担。担当外は仲間に「リクエスト」して入れてもらう</div>
        <div><b>対戦</b>同じ注文を早い者勝ちで奪い合う。難しいものほど強い「おじゃま」が飛ぶ</div>
      </div>
    </div>

    <div class="busybox"><div class="busy-h">忙しさ</div><div class="seg busy" id="titleBusy"></div><p class="busydesc note"></p></div>
    <div class="sec-title">ひとりで</div>
    <div class="stages" id="stageList"></div>
    <div class="row-btns">
      <button class="btn sub" id="btnDex">反応図鑑</button>
      <button class="btn sub" id="btnHow">遊び方</button>
      <button class="btn sub" id="btnSettings">⚙ 設定</button>
      <button class="btn sub" id="btnMute">音: ON</button>
      <button class="btn sub" id="btnCoef">係数判定: OFF</button>
      <button class="btn sub" data-fs>⛶ 全画面</button>
    </div>
    <div class="howto" id="howto"></div>
  </section>

  <!-- ロビー -->
  <section id="lobby" class="screen" aria-label="ロビー">
    <div class="lob-head">
      <button class="btn sub" id="btnLeave">退出</button>
      <div class="room"><span>部屋コード</span><b id="lobCode">----</b></div>
    </div>
    <div class="invite">
      <div class="qr" id="qr" aria-label="招待用QRコード"></div>
      <div class="acts">
        <button class="btn" id="btnCopy">招待リンクをコピー</button>
        <button class="btn sub" id="btnShare">共有する</button>
        <p class="note">友達はQRを読む／リンクを開く／トップの「部屋に入る」でコードを入力。</p>
      </div>
    </div>
    <div class="lob-sec"><h4>プレイヤー <span id="lobCount"></span></h4><div class="lob-players" id="lobPlayers"></div></div>
    <div class="lob-sec">
      <h4>ゲーム</h4>
      <div class="seg subj" id="lobSubj"><button data-subj="chem">🧪 化学</button><button data-subj="eng">🔤 英語</button></div>
      <div class="seg gsel" id="lobGame"><button data-g="rx">反応式モード<small>試薬・触媒・加熱</small></button><button data-g="atom">組成モード<small>元素から分子式</small></button><button data-g="org">官能基モード<small>部品・検出反応</small></button><button data-g="ion">無機イオンモード<small>イオン・半反応式</small></button><button data-g="quiz">早押しクイズ<small>ヒントから物質を当てる</small></button><button data-g="eroot">語根モード<small>接頭辞・語根・接尾辞</small></button><button data-g="esyn">構文モード<small>語句を並べる</small></button><button data-g="eword">見分けモード<small>紛らわしい2語</small></button></div>
    </div>
    <div class="lob-sec">
      <h4>協力／対戦</h4>
      <div class="seg" id="lobMode"><button data-mode="coop">協力</button><button data-mode="versus">対戦</button></div>
    </div>
    <div class="howto rules" id="lobRules"></div>
    <div class="lob-sec">
      <h4>ステージ</h4>
      <div class="lob-stages" id="lobStages"></div>
      <h4 style="margin-top:10px">忙しさ</h4>
      <div class="seg busy" id="lobBusy"></div><p class="busydesc note"></p>
      <label class="toggle" id="lobSplitRow"><input type="checkbox" id="lobSplit" checked>棚を分担する（OFFにすると全員が全試薬を使える）</label>
      <label class="toggle"><input type="checkbox" id="lobAuto">必要なものがそろったら自動で精製する</label>
      <label class="toggle" id="lobCoefRow"><input type="checkbox" id="lobCoef">係数も判定する（上級。京大ラッシュは常にON）</label>
    </div>
    <div class="lob-foot">
      <button class="btn go" id="btnStart">開店する</button>
      <p class="note" id="lobWait"></p>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen" aria-label="ゲーム">
    <div class="hud">
      <button class="icon" id="btnPause" aria-label="一時停止">II</button>
      <button class="icon fsb" data-fs aria-label="全画面">⛶</button>
      <div class="pill time" id="hudTime">2:30</div>
      <div class="stage-tag" id="hudStage"></div>
      <span class="rot hudrot" id="hudRot" style="display:none"></span>
      <div class="incoming" id="incoming"></div>
      <div class="pill score"><span class="combo" id="hudCombo"></span><span id="hudScore">0</span></div>
    </div>
    <div class="mpbar" id="mpbar">
      <div class="who" id="mpWho"></div>
      <span class="rot" id="mpRot"></span>
      <button class="stampbtn" id="btnStamp" aria-label="スタンプ">💬</button>
    </div>
    <div class="orders" id="orders"></div>
    <div class="quizbox" id="quizbox"></div>
    <div class="actbar" id="actbar"></div>
    <div class="ptable" id="ptable"><div class="half L" id="ptL"></div><div class="half R" id="ptR"></div></div>
    <div class="stamps" id="stamps"></div>
    <div class="feed" id="feed"></div>
    <div class="count" id="count"></div>
    <div id="rotate" role="dialog" aria-label="スマホの向き">
      <div class="rot-ico">📱↻</div>
      <b>スマホを横向きにして遊ぶ</b>
      <p></p>
      <div class="row-btns"><button class="btn go" id="btnPortrait">持ち方に合わせる</button><button class="btn sub" data-fs>⛶ 全画面にする</button></div>
    </div>
  </section>

  <!-- 図鑑 -->
  <section id="dex" class="screen" aria-label="反応図鑑">
    <div class="dex-head"><h2 id="dexTitle">反応図鑑</h2><button class="btn sub" style="flex:0 0 auto;min-width:0" id="btnDexBack">戻る</button></div>
    <div class="dex-sum" id="dexSum"></div>
    <div class="dex-list" id="dexList"></div>
  </section>

  <div class="overlay" id="ov"><div class="panel" id="ovPanel"></div></div>
</div>

<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
